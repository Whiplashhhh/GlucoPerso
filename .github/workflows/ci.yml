name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  NEXT_TELEMETRY_DISABLED: 1
  # Needed by prisma.config.ts even for `prisma generate`; jobs with a real
  # database override it.
  DATABASE_URL: postgresql://glucoperso:glucoperso@localhost:5432/glucoperso_test

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Integration & end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: glucoperso
          POSTGRES_PASSWORD: glucoperso
          POSTGRES_DB: glucoperso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glucoperso"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://glucoperso:glucoperso@localhost:5432/glucoperso_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration -- --passWithNoTests
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: glucoperso:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Native modules load in the image
        run: >-
          docker run --rm --entrypoint node glucoperso:ci -e
          "require('sharp');require('@node-rs/argon2');console.log('native modules OK')"
      - name: Prisma CLI available for migrations
        run: docker run --rm --entrypoint /opt/migrate/node_modules/.bin/prisma glucoperso:ci --version

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
